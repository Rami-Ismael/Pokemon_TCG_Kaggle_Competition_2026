[project]
name = "pokemon-tcg-kaggle-competition-2026"
version = "0.1.0"
description = "EY AI & Data Challenge / Kaggle: Pokemon TCG competition 2026."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kaggle>=2.2.4",
    "kaggle-environments>=1.32.2",
    "marimo>=0.23.15",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tqdm>=4.69.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_tcg"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
